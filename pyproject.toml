[project]
name = "library-catalog"
version = "0.1.0"
description = "REST API для управления библиотечным каталогом (FastAPI + PostgreSQL)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.159.1,<0.160.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.poetry]
# Это приложение, а не библиотека для PyPI: Poetry только ставит зависимости
# и не пытается «установить» сам проект как пакет.
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"           # async-тесты запускаются без @pytest.mark.asyncio
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]              # чтобы работал импорт `src.library_catalog...`
testpaths = ["tests"]
# Предупреждение внутри starlette (не в нашем коде) — скрываем.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
